<!-- ============================================ -->
<!-- REQUEST COMPLIMENTARY TEST -->
<!-- ============================================ -->
<section class="section-full bg-white" id="request-test">
  <div class="text-center">
    <span class="section-label">Free Consultation</span>
    <h2 class="section-title">Request Your Digestive <span class="gold shimmer-text">Complimentary Test</span></h2>
    <p class="section-sub mx-auto">Our experts will help you understand your digestive health.</p>
  </div>

  <div class="request-form-wrapper">
    <form class="request-form" id="requestForm" onsubmit="submitRequest(event)">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required />
      </div>
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>
      
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your phone number" required />
      </div>
      
      <div class="form-group">
        <label for="message">Your Concern (Optional)</label>
        <textarea id="message" placeholder="Tell us about your digestive concerns..." rows="3"></textarea>
      </div>
      
      <button type="submit" class="btn-premium pulse-glow" style="width:100%;">
        <i class="fas fa-paper-plane"></i> Request My Complimentary Test
      </button>
      
      <p class="form-note">
        <i class="fas fa-lock" style="color: var(--gold);"></i> Your information is secure and confidential.
      </p>
    </form>
    
    <!-- Success Message -->
    <div class="form-success" id="formSuccess" style="display:none;">
      <div class="success-icon">✅</div>
      <h3>Request Submitted!</h3>
      <p>Thank you for your request. Our team will contact you within 24 hours.</p>
      <a href="#offer-pricing" class="btn-premium">
        <i class="fas fa-shopping-bag"></i> Shop Now
      </a>
    </div>
  </div>
</section>

<style>
.request-form-wrapper {
  max-width: 560px;
  margin: 28px auto 0;
  background: var(--bg-cream);
  border-radius: 24px;
  padding: 40px 44px;
  border: 1px solid var(--border-light);
}
.request-form .form-group {
  margin-bottom: 18px;
}
.request-form label {
  display: block;
  font-family: 'Be Vietnam Pro', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--charcoal);
  margin-bottom: 4px;
}
.request-form input,
.request-form textarea {
  width: 100%;
  padding: 12px 18px;
  border: 2px solid var(--border-light);
  border-radius: 12px;
  font-family: 'Be Vietnam Pro', sans-serif;
  font-size: 0.95rem;
  transition: all 0.3s ease;
  background: #fff;
  color: var(--charcoal);
}
.request-form input:focus,
.request-form textarea:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 4px rgba(200, 157, 74, 0.1);
}
.request-form textarea {
  resize: vertical;
  min-height: 80px;
}
.request-form .btn-premium {
  margin-top: 4px;
  text-align: center;
}
.form-note {
  margin-top: 14px;
  font-size: 0.75rem;
  color: var(--warm-gray);
  text-align: center;
  font-family: 'Be Vietnam Pro', sans-serif;
}
.form-note i {
  margin-right: 6px;
}

.form-success {
  text-align: center;
  padding: 20px 0;
}
.form-success .success-icon {
  font-size: 3.5rem;
  margin-bottom: 8px;
}
.form-success h3 {
  font-family: 'Faculty Glyphic', serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--charcoal);
  margin-bottom: 4px;
}
.form-success p {
  font-family: 'Be Vietnam Pro', sans-serif;
  font-size: 0.95rem;
  color: var(--warm-gray);
  margin-bottom: 18px;
}

@media (max-width: 600px) {
  .request-form-wrapper {
    padding: 24px 20px;
    border-radius: 16px;
  }
  .request-form input,
  .request-form textarea {
    padding: 10px 14px;
    font-size: 0.85rem;
  }
  .form-success h3 {
    font-size: 1.2rem;
  }
}
</style>

<script>
function submitRequest(event) {
  event.preventDefault();
  
  const name = document.getElementById('fullName').value;
  const email = document.getElementById('email').value;
  const phone = document.getElementById('phone').value;
  
  // Simple validation
  if (!name || !email || !phone) {
    alert('Please fill in all required fields.');
    return;
  }
  
  // Hide form, show success
  document.getElementById('requestForm').style.display = 'none';
  document.getElementById('formSuccess').style.display = 'block';
  
  // Scroll to success
  document.querySelector('.request-form-wrapper').scrollIntoView({ behavior: 'smooth', block: 'center' });
  
  // Optional: Send to WhatsApp
  const message = `Hello Eco Bee, I would like to request a complimentary digestive test.%0A%0AName: ${name}%0AEmail: ${email}%0APhone: ${phone}`;
  console.log('Form submitted:', { name, email, phone });
}
</script>
