<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found - Eco Bee</title>
  
  <!-- GOOGLE FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Be+Vietnam+Pro:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FONT AWESOME -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: #FCF6E8;
      color: #231F20;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .error-container {
      max-width: 600px;
      width: 100%;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 50px 40px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(35, 31, 32, 0.08);
      border: 1px solid #E0D8CC;
    }
    
    .error-icon {
      font-size: 4rem;
      color: #C89700;
      margin-bottom: 16px;
      display: block;
    }
    
    .error-code {
      font-family: 'Faculty Glyphic', serif;
      font-size: 5rem;
      font-weight: 800;
      color: #C89700;
      line-height: 1;
      margin-bottom: 8px;
    }
    
    .error-title {
      font-family: 'Faculty Glyphic', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #231F20;
      margin-bottom: 8px;
    }
    
    .error-text {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 1rem;
      color: #8A8580;
      line-height: 1.7;
      margin-bottom: 24px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .error-text i {
      color: #C89700;
      margin-right: 4px;
    }
    
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #C89700;
      color: #FFFFFF;
      padding: 14px 36px;
      border-radius: 50px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 25px rgba(200, 151, 0, 0.3);
    }
    
    .btn-home:hover {
      background: #A87A00;
      transform: translateY(-3px);
      box-shadow: 0 8px 35px rgba(200, 151, 0, 0.4);
    }
    
    .btn-home i {
      font-size: 0.9rem;
    }
    
    .error-help {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #E0D8CC;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 0.8rem;
      color: #8A8580;
    }
    
    .error-help a {
      color: #C89700;
      text-decoration: none;
      font-weight: 600;
    }
    
    .error-help a:hover {
      text-decoration: underline;
    }
    
    .logo-small {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .logo-small img {
      height: 40px;
      width: auto;
      border-radius: 50%;
    }
    
    .logo-small span {
      font-family: 'Faculty Glyphic', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #231F20;
    }
    
    .logo-small span .gold {
      color: #C89700;
    }
    
    @media (max-width: 600px) {
      .error-container {
        padding: 30px 20px 28px;
      }
      .error-code {
        font-size: 3.5rem;
      }
      .error-title {
        font-size: 1.4rem;
      }
      .error-text {
        font-size: 0.85rem;
      }
      .btn-home {
        padding: 12px 28px;
        font-size: 0.7rem;
      }
      .logo-small span {
        font-size: 1.1rem;
      }
      .logo-small img {
        height: 32px;
      }
    }
  </style>
</head>
<body>

  <div class="error-container">
    
    <!-- Logo -->
    <div class="logo-small">
      <img src="assets/images/logoecobee.jpg" alt="Eco Bee">
      <span>Eco <span class="gold">Bee</span></span>
    </div>
    
    <!-- Error Icon -->
    <span class="error-icon"><i class="fas fa-tree"></i></span>
    
    <!-- Error Code -->
    <div class="error-code">404</div>
    
    <!-- Title -->
    <h1 class="error-title">Page Not Found</h1>
    
    <!-- Message -->
    <p class="error-text">
      <i class="fas fa-leaf"></i> Oops! The page you're looking for seems to have flown away with the bees.
      <br><br>
      Don't worry, our honey is still here waiting for you.
    </p>
    
    <!-- Back to Home -->
    <a href="/" class="btn-home">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>
    
    <!-- Help -->
    <div class="error-help">
      Need help? <a href="#contact">Contact us</a> or visit our 
      <a href="https://www.ecobeeshop.my" target="_blank">official store</a>
    </div>
    
  </div>

</body>
</html>
